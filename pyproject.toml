[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psycoupler"
version = "0.2.2"
description = "Measure psychological coupling dynamics in human-LLM conversations"
readme = "README.md"
authors = [
    {name = "Eslam Ahmed", email = "eslam66ahmad@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["llm", "ai-safety", "psychology", "conversation-analysis", "human-ai", "coupling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "sentence-transformers>=2.2",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/eslam-ahmed43/psycoupler"
Repository = "https://github.com/eslam-ahmed43/psycoupler"
BugTracker = "https://github.com/eslam-ahmed43/psycoupler/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["psycoupler*"]